<html lang="zh-CN">

<link rel="manifest" href='data:application/manifest+json,{"name":"深职大香蜜校区校园指南","short_name":"香蜜指南","start_url":".","display":"standalone","orientation":"portrait","background_color":"%23ffffff","theme_color":"%23ff7823","icons":[{"src":"data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27512%27%20height=%27512%27%3E%3Crect%20width=%27512%27%20height=%27512%27%20rx=%27110%27%20fill=%27%23ff7823%27/%3E%3Ctext%20x=%2750%25%27%20y=%2758%25%27%20font-size=%27300%27%20text-anchor=%27middle%27%20fill=%27white%27%20font-family=%27sans-serif%27%3E香%3C/text%3E%3C/svg%3E","sizes":"512x512","type":"image/svg+xml"}]}'>

<style>
  :root{
    --brand:#ff7823;
    --brand-light:#fff3ea;
    --brand-dark:#e8650f;
    --ink:#1f2329;
    --muted:#8a8f99;
    --line:#f0f0f2;
    --bg:#f6f7f9;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Helvetica,"Microsoft YaHei",sans-serif;
    color:var(--ink);background:#e9eaee;
    -webkit-text-size-adjust:100%;
  }
  /* 仿 APP 容器：最大 480，竖屏，满屏高度（dvh 适配移动浏览器工具栏） */
  #app{
    position:relative;max-width:480px;margin:0 auto;height:100dvh;
    background:var(--bg);overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.08);
  }
  .view{flex:1;display:flex;flex-direction:column;min-height:0;}
  .view.hidden{display:none;}

  /* 顶栏 */
  .topbar{
    flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
    background:#fff;border-bottom:1px solid var(--line);
  }
  .topbar h1{font-size:18px;margin:0;font-weight:800;flex:1;color:var(--brand);}
  .topbar .back{
    border:none;background:var(--brand-light);color:var(--brand);
    width:38px;height:38px;border-radius:50%;font-size:20px;font-weight:700;
    display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  }
  .topbar .edit-pen{
    border:none;background:var(--brand-light);color:var(--brand);
    padding:8px 14px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;flex:0 0 auto;
  }

  /* 滚动区：纵向 */
  .scroll-y{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 90px;}

  /* 轮播 */
  .carousel{position:relative;border-radius:20px;overflow:hidden;box-shadow:0 8px 24px rgba(255,120,35,.18);}
  .carousel .track{display:flex;transition:transform .35s ease;will-change:transform;}
  .carousel .slide{flex:0 0 100%;height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;position:relative;}
  .carousel .slide .emoji{font-size:64px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2));}
  .carousel .slide .cap{margin-top:10px;font-size:18px;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.25);padding:0 16px;text-align:center;}
  .carousel .dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}
  .carousel .dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);transition:.2s;}
  .carousel .dots i.on{width:18px;border-radius:4px;background:#fff;}

  /* 学院简介 */
  .intro-card{background:#fff;border-radius:18px;padding:16px;margin-top:14px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
  .intro-card h2{font-size:15px;color:var(--brand);margin:0 0 8px;font-weight:800;}
  .intro-card p{font-size:14px;line-height:1.7;color:#444;margin:0;white-space:pre-wrap;}

  /* 三大板块入口 */
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px;}
  .three .card{
    background:#fff;border-radius:18px;padding:18px 10px;text-align:center;cursor:pointer;
    box-shadow:0 4px 16px rgba(0,0,0,.05);transition:transform .12s;
  }
  .three .card:active{transform:scale(.96);}
  .three .card .ic{font-size:40px;}
  .three .card .t{margin-top:8px;font-weight:800;font-size:15px;}
  .three .card .s{margin-top:2px;font-size:11px;color:var(--muted);}

  .section-title{font-size:15px;font-weight:800;color:var(--brand);margin:22px 2px 10px;}

  /* 横向分类标签栏：仅横向滚动，不与内容纵向滚动冲突 */
  .tabs{
    flex:0 0 auto;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;
    padding:12px 14px;border-bottom:1px solid var(--line);background:#fff;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;white-space:nowrap;cursor:grab;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tabs.dragging{cursor:grabbing;}
  .tabs .tab{
    flex:0 0 auto;padding:8px 16px;border-radius:999px;background:var(--bg);color:#555;
    font-size:14px;font-weight:700;border:1px solid transparent;user-select:none;
  }
  .tabs .tab.on{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(255,120,35,.3);}

  /* 内容卡片列表 */
  .cards{display:flex;flex-direction:column;gap:12px;}
  .card-item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.05);display:flex;flex-direction:column;}
  .card-item .media{height:150px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;position:relative;}
  .card-item .media img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-item .media .ph{font-size:54px;}
  .card-item .body{padding:12px 14px;}
  .card-item .body .tag{display:inline-block;font-size:11px;color:var(--brand);background:var(--brand-light);padding:3px 9px;border-radius:999px;font-weight:700;margin-bottom:6px;}
  .card-item .body .ct{font-size:16px;font-weight:800;}
  .card-item .body .cd{font-size:13px;color:#666;line-height:1.6;margin-top:4px;}
  .card-item .ops{display:flex;gap:8px;padding:0 14px 12px;}
  .card-item .ops button{flex:1;border:none;border-radius:10px;padding:9px 0;font-size:13px;font-weight:700;cursor:pointer;}
  .card-item .ops .e{background:var(--brand-light);color:var(--brand);}
  .card-item .ops .d{background:#fdecec;color:#e23b3b;}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  /* 悬浮新增按钮（仅编辑模式可见） */
  .fab{
    position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);
    margin:0 auto;width:max-content;background:var(--brand);color:#fff;border:none;
    padding:14px 26px;border-radius:999px;font-size:15px;font-weight:800;
    box-shadow:0 -4px 22px rgba(255,120,35,.4);cursor:pointer;
  }

  /* WAN 只读模式：隐藏全部编辑入口 */
  body.mode-wan .edit-only{display:none !important;}

  /* 模态框 */
  .modal{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:70;}
  .modal.hidden{display:none;}
  .sheet{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88%;overflow-y:auto;}
  .sheet h3{margin:0 0 14px;font-size:17px;font-weight:800;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:#666;margin-bottom:6px;font-weight:700;}
  .field input,.field textarea,.field select{
    width:100%;border:1px solid #e2e4e8;border-radius:12px;padding:12px;font-size:16px;
    font-family:inherit;background:#fafafa;color:var(--ink);min-height:46px;
  }
  .field textarea{resize:vertical;min-height:80px;}
  .imgpick{display:block;border:1.5px dashed #d8dade;border-radius:14px;padding:18px;text-align:center;color:#888;font-size:14px;cursor:pointer;background:#fafafa;}
  .imgpick img{max-width:100%;max-height:140px;border-radius:10px;margin-top:8px;}
  .sheet .actions{display:flex;gap:10px;margin-top:6px;}
  .sheet .actions button{flex:1;border:none;border-radius:12px;padding:14px 0;font-size:15px;font-weight:800;cursor:pointer;}
  .btn-ok{background:var(--brand);color:#fff;}
  .btn-cancel{background:#f0f1f3;color:#444;}

  /* Toast */
  .toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);background:rgba(0,0,0,.82);color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;z-index:99;pointer-events:none;transition:opacity .25s;}
  .toast.hidden{opacity:0;visibility:hidden;}

  /* 只读水印提示 */
  .ro-tip{background:#fff7f0;color:var(--brand);font-size:12px;text-align:center;padding:8px;border-radius:10px;margin-top:12px;font-weight:700;}

  /* 卡片可点击打开详情 */
  .card-item{cursor:pointer;}

  /* 内容详情弹窗（全屏） */
  .detail-modal{position:absolute;inset:0;background:#fff;z-index:60;display:flex;flex-direction:column;overflow:hidden;}
  .detail-modal.hidden{display:none;}
  .detail-close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:12px;z-index:3;border:none;background:rgba(255,255,255,.92);color:var(--brand);
    padding:8px 16px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.15);}
  /* 顶部横向相册：仅横向滑动，与正文纵向互不冲突（核心：touch-action 分区） */
  .gallery{flex:0 0 auto;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;touch-action:pan-x;background:#000;scrollbar-width:none;}
  .gallery::-webkit-scrollbar{display:none;}
  .gallery .g-slide{flex:0 0 100%;width:100%;height:300px;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;position:relative;}
  .gallery .g-slide img{width:100%;height:100%;object-fit:cover;display:block;}
  .gallery .g-slide .ph{font-size:72px;}
  .gallery .g-count{position:absolute;top:calc(env(safe-area-inset-top) + 14px);right:14px;background:rgba(0,0,0,.55);color:#fff;
    font-size:12px;padding:4px 10px;border-radius:999px;z-index:3;pointer-events:none;}
  /* 正文：垂直滚动 */
  .detail-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
    padding:18px 18px calc(env(safe-area-inset-bottom) + 96px);}
  .detail-body .tag{display:inline-block;font-size:12px;color:var(--brand);background:var(--brand-light);padding:4px 12px;border-radius:999px;font-weight:700;}
  .detail-body .dt{font-size:22px;font-weight:800;margin-top:10px;color:var(--ink);}
  .detail-body .dd{font-size:15px;line-height:1.85;color:#444;margin-top:12px;white-space:pre-wrap;}
  .detail-body .hint{color:var(--muted);font-size:12px;margin-top:16px;}
  /* 详情底部操作（仅 LAN 可见） */
  .detail-ops{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);display:none;gap:10px;padding:0 18px;}
  .detail-ops button{flex:1;border:none;border-radius:14px;padding:15px 0;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 -4px 22px rgba(0,0,0,.12);}
  .detail-ops .e{background:var(--brand);color:#fff;}
  .detail-ops .d{background:#fdecec;color:#e23b3b;}
  /* 编辑面板：多图缩略图网格 */
  .thumb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f0f0f2;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;
    border:none;font-size:14px;line-height:1;cursor:pointer;}
  /* 触屏优化：放大操作按钮，便于手指点击 */
  .sheet .actions button{padding:16px 0;font-size:16px;}
  .card-item .ops button{padding:13px 0;font-size:14px;}
  .sheet{max-height:92%;}
</style>
</head>
<body class="mode-lan">
<div id="app">

  <!-- ============ 首页 ============ -->
  <section id="view-home" class="view">
    <header class="topbar">
      <h1 id="homeTitle">香蜜校区 · 校园指南</h1>

    <div class="scroll-y">
      <div class="carousel" id="carousel">

      <div class="three">
        <div class="card" onclick="openSection('foods')"><div class="ic">🍜</div><div class="t">吃什么</div><div class="s">EAT</div></div>
        <div class="card" onclick="openSection('study')"><div class="ic">📚</div><div class="t">学什么</div><div class="s">STUDY</div></div>
        <div class="card" onclick="openSection('clubs')"><div class="ic">🎭</div><div class="t">玩什么</div><div class="s">PLAY</div></div>
      </div>

      <div class="ro-tip mode-wan-only" id="roTip" style="display:none">📖 当前为只读模式（非同一局域网），内容仅可浏览，不可编辑</div>

    <div class="detail-ops edit-only" id="dOps"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
</div>

<script>
/* =========================================================
   1) 权限判定：局域网(同WiFi) = 可编辑；公网(其他网络/流量) = 只读
   - file:// 或 localhost / 私有IP(192.168/10/172.16-31/127/169.254) → 局域网
   - 平台生成的公网预览域名 → 只读
   ========================================================= */
function isPrivateHost(h){
  if(!h) return false;
  h = h.toLowerCase().split(':')[0].trim();
  if(h==='localhost' || h==='[::1]' || h.endsWith('.local')) return true;
  if(/^127\./.test(h)) return true;
  if(/^192\.168\./.test(h)) return true;
  if(/^10\./.test(h)) return true;
  if(/^172\.(1[6-9]|2\d|3[01])\./.test(h)) return true;
  if(/^169\.254\./.test(h)) return true;
  return false;
}
const IS_LAN = (location.protocol==='file:') || isPrivateHost(location.hostname);
document.body.classList.remove('mode-lan','mode-wan');
document.body.classList.add(IS_LAN ? 'mode-lan' : 'mode-wan');
if(!IS_LAN){ document.getElementById('roTip').style.display='block'; }

/* =========================================================
   2) LocalStorage 数据层（无后端、无端口、数据存浏览器本地）
   ========================================================= */
const LS = {
  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
};
const K = {
  title:'cg_title', intro:'cg_intro', car:'cg_carousel',
  foodCats:'cg_food_cats', studyCats:'cg_study_cats', clubCats:'cg_club_cats',
  foods:'cg_foods', study:'cg_study', clubs:'cg_clubs'
};
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* 生成占位图（SVG dataURL），用于示例数据的相册演示 */
function svgImg(bg,txt){
  const s=`<svg xmlns='http://www.w3.org/2000/svg' width='600' height='400'><rect width='600' height='400' fill='${bg}'/><text x='50%' y='54%' font-size='38' fill='white' text-anchor='middle' font-family='sans-serif'>${txt}</text></svg>`;
  return 'data:image/svg+xml,'+encodeURIComponent(s);
}
/* 兼容：确保条目有 images 数组（旧数据可能只有单图 img） */
function normImages(it){
  if(it && (!Array.isArray(it.images) || it.images.length===0)){
    it.images = it.img ? [it.img] : [];
  }
  return it;
}

function seed(){
  if(LS.get(K.title,null)===null) LS.set(K.title,'香蜜校区 · 校园指南');
  if(LS.get(K.intro,null)===null) LS.set(K.intro,
'深圳职业技术大学香蜜校区 · 创新创意设计艺术学院，坐落于深圳市福田区香蜜湖畔。\n学院聚焦工艺美术、视觉传达、产品与空间设计等方向，倡导"手艺 + 审美 + 创新"的育人理念，培养兼具工匠精神与设计思维的应用型创意人才。\n这里收录校园周边好吃、好学的去处，以及好玩的社团与工作室，供同学们随时翻看。');
  if(LS.get(K.car,null)===null) LS.set(K.car,[
    {id:uid(),emoji:'🎨',cap:'创新创意设计艺术学院',color:'#ff7823'},
    {id:uid(),emoji:'🏫',cap:'深职大 · 香蜜校区',color:'#ff9a3c'},
    {id:uid(),emoji:'🌿',cap:'艺术 · 设计 · 生活',color:'#ff6a00'},
  ]);
  if(LS.get(K.foodCats,null)===null) LS.set(K.foodCats,['食堂','咖啡','小吃','外卖']);
  if(LS.get(K.studyCats,null)===null) LS.set(K.studyCats,['课程','讲座','工作坊','资料']);
  if(LS.get(K.clubCats,null)===null) LS.set(K.clubCats,['社团','工作室','比赛','展览']);
  if(LS.get(K.foods,null)===null) LS.set(K.foods,[
    {id:uid(),cat:'食堂',title:'一饭堂 · 自选快餐',desc:'性价比之王，午晚餐种类多，阿姨手不抖。',emoji:'🍚',images:[svgImg('#ff7823','食堂 · 实拍 1'),svgImg('#ff9a3c','食堂 · 实拍 2'),svgImg('#ff6a00','窗口 · 实拍 3')]},
    {id:uid(),cat:'咖啡',title:'湖畔咖啡角',desc:'靠窗座位多，适合赶作业和小组讨论。',emoji:'☕',images:[svgImg('#6f4e37','咖啡角 1'),svgImg('#caa472','咖啡角 2')]},
    {id:uid(),cat:'小吃',title:'校门口鸡蛋仔',desc:'放学必买，现做现卖，奶香十足。',emoji:'🧇',images:[svgImg('#ffd27a','鸡蛋仔 1'),svgImg('#ffb347','鸡蛋仔 2')]},
  ]);
  if(LS.get(K.study,null)===null) LS.set(K.study,[

    {id:uid(),cat:'讲座',title:'设计师沙龙',desc:'每月邀请行业设计师分享真实项目案例。',emoji:'🎤',images:[svgImg('#3a3f4a','沙龙 1'),svgImg('#5a6172','沙龙 2')]},
    {id:uid(),cat:'工作坊',title:'丝网印刷 workshop',desc:'亲手印好自己的帆布袋，名额有限。',emoji:'🖨️',images:[svgImg('#444444','印刷 1'),svgImg('#777777','印刷 2')]},

  if(LS.get(K.clubs,null)===null) LS.set(K.clubs,[

    {id:uid(),cat:'比赛',title:'文创设计大赛',desc:'年度重磅，获奖作品落地文创店售卖。',emoji:'🏆',images:[svgImg('#ff7823','大赛 1'),svgImg('#ff9a3c','大赛 2')]},
  ]);

seed();

/* 旧数据迁移：把单图 img 字段转为 images 数组，保持兼容 */
function migrate(){
  [K.foods,K.study,K.clubs].forEach(k=>{
    const list=LS.get(k,[]); let changed=false;
    list.forEach(it=>{ if(!Array.isArray(it.images)){ it.images = it.img ? [it.img] : []; delete it.img; changed=true; } });
    if(changed) LS.set(k,list);
  });
}
migrate();

/* =========================================================
   3) 首页渲染（轮播 + 简介 + 板块入口）
   ========================================================= */
function renderHome(){
  document.getElementById('homeTitle').textContent = LS.get(K.title,'');
  document.getElementById('introText').textContent = LS.get(K.intro,'');
  const slides = LS.get(K.car,[]);
  const track = document.getElementById('carTrack');
  const dots = document.getElementById('carDots');
  track.innerHTML=''; dots.innerHTML='';
  slides.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'; d.style.background=`linear-gradient(135deg,${s.color},${shade(s.color,-18)})`;
    d.innerHTML=`<div class="emoji">${s.emoji||'🖼️'}</div><div class="cap">${esc(s.cap||'')}</div>`;
    track.appendChild(d);
    const dot=document.createElement('i'); if(i===0)dot.className='on'; dots.appendChild(dot);
  });
  initCarousel(slides.length);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function shade(hex,p){
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=Math.max(0,Math.min(255,r+p));g=Math.max(0,Math.min(255,g+p));b=Math.max(0,Math.min(255,b+p));
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* 轮播：自动播放 + 手指拖拽 */
let carIdx=0, carTimer=null, carStartX=0, carDrag=false;
function initCarousel(n){
  const track=document.getElementById('carTrack');
  const dots=document.getElementById('carDots').children;
  function go(i){
    carIdx=(i+n)%n; track.style.transform=`translateX(-${carIdx*100}%)`;
    for(let k=0;k<dots.length;k++) dots[k].className = (k===carIdx)?'on':'';
  }
  function restart(){ clearInterval(carTimer); if(n>1) carTimer=setInterval(()=>go(carIdx+1),4000); }
  const box=document.getElementById('carousel');
  box.onpointerdown=e=>{carDrag=true;carStartX=e.clientX;box.setPointerCapture(e.pointerId);clearInterval(carTimer);};
  box.onpointerup=e=>{ if(!carDrag)return; carDrag=false; const dx=e.clientX-carStartX;
    if(dx<-40)go(carIdx+1); else if(dx>40)go(carIdx-1); else go(carIdx); restart(); };
  box.onpointerleave=()=>{ if(carDrag){carDrag=false;restart();} };
  restart();
}

/* =========================================================
   4) 二级页：横向分类标签(可拖拽) + 纵向内容(独立滚动)
   ========================================================= */
let curType='foods', curCat='全部';
const TYPE_META={
  foods:{key:K.foods,cats:K.foodCats,title:'吃什么',emoji:'🍜'},
  study:{key:K.study,cats:K.studyCats,title:'学什么',emoji:'📚'},
  clubs:{key:K.clubs,cats:K.clubCats,title:'玩什么',emoji:'🎭'},
};
function openSection(type){
  curType=type; curCat='全部';
  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-section').classList.remove('hidden');
  const m=TYPE_META[type];
  document.getElementById('secTitle').textContent=m.title;
  renderTabs(); renderCards();
  enableTabDrag(document.getElementById('tabs'));
}
function goHome(){
  document.getElementById('view-section').classList.add('hidden');
  document.getElementById('view-home').classList.remove('hidden');
}
function renderTabs(){
  const cats=LS.get(TYPE_META[curType].cats,[]);
  const tabs=document.getElementById('tabs'); tabs.innerHTML='';
  ['全部',...cats].forEach(c=>{
    const t=document.createElement('div'); t.className='tab'+(c===curCat?' on':''); t.textContent=c;
    t.onclick=()=>{curCat=c;renderTabs();renderCards();};
    tabs.appendChild(t);
  });
}
function renderCards(){
  const items=LS.get(TYPE_META[curType].key,[]).filter(it=>curCat==='全部'||it.cat===curCat);
  const box=document.getElementById('cards'); box.innerHTML='';
  if(items.length===0){ box.innerHTML='<div class="empty">暂无内容，'+(IS_LAN?'点击右下角新增':'该分类还没有内容')+'</div>'; return; }
  items.forEach(it=>{
    normImages(it);
    const el=document.createElement('div'); el.className='card-item'; el.onclick=()=>openDetail(it.id);
    const media = it.images.length ? `<img src="${it.images[0]}" alt="">` : `<div class="ph">${it.emoji||'📌'}</div>`;
    const ops = IS_LAN ? `<div class="ops" onclick="event.stopPropagation()"><button class="e" onclick="openItemEdit('${it.id}')">编辑</button><button class="d" onclick="delItem('${it.id}')">删除</button></div>` : '';
    el.innerHTML=`<div class="media">${media}</div><div class="body"><span class="tag">${esc(it.cat||'')}</span><div class="ct">${esc(it.title||'')}</div><div class="cd">${esc(it.desc||'')}</div></div>${ops}`;
    box.appendChild(el);
  });
}
/* 标签栏拖拽滚动（桌面端也可用鼠标拖） */
function enableTabDrag(el){
  let down=false,sx=0,sl=0,moved=false;
  el.onpointerdown=e=>{down=true;sx=e.clientX;sl=el.scrollLeft;moved=false;el.classList.add('dragging');};
  el.onpointermove=e=>{ if(!down)return; const dx=e.clientX-sx; if(Math.abs(dx)>4)moved=true; el.scrollLeft=sl-dx; };
  el.onpointerup=el.onpointerleave=()=>{down=false;el.classList.remove('dragging');};
  el.onclick=e=>{ if(moved){e.preventDefault();e.stopPropagation();} };
}

/* =========================================================
   5) 编辑（仅局域网模式可用；本地存储，刷新即生效）
   ========================================================= */
let editImages=[];   // 编辑态临时多图数组（全局，供缩略图删除按钮调用）
function openItemEdit(id){
  if(!IS_LAN){ toast('只读模式，无法编辑'); return; }
  const m=TYPE_META[curType];
  const cats=LS.get(m.cats,[]);
  const list=LS.get(m.key,[]);
  const it = id ? list.find(x=>x.id===id) : {id:uid(),cat:cats[0]||'',title:'',desc:'',emoji:'📌',images:[]};
  if(it && !Array.isArray(it.images)) it.images = it.img?[it.img]:[];
  editImages = (it.images||[]).slice();
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`
    <h3>${id?'编辑内容':'新增内容'}</h3>
    <div class="field"><label>分类</label><select id="f_cat">${cats.map(c=>`<option ${c===it.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></div>
    <div class="field"><label>标题</label><input id="f_title" value="${esc(it.title)}" placeholder="例如：湖畔咖啡角"></div>
    <div class="field"><label>简介</label><textarea id="f_desc" placeholder="一句话描述">${esc(it.desc)}</textarea></div>
    <div class="field"><label>图标 emoji（无图片时显示）</label><input id="f_emoji" value="${esc(it.emoji||'')}" placeholder="🍜" maxlength="4"></div>
    <div class="field"><label>图片（可多选，自动压缩，最多 9 张）</label>
      <label class="imgpick" for="f_imgs">📷 点击选择图片（可多选）<input id="f_imgs" type="file" accept="image/*" multiple class="hidden"></label>
      <div class="thumb-grid" id="f_thumbs"></div>
    </div>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-ok" onclick="saveItem('${it.id}')">保存</button>
    </div>`;
  renderThumbs();
  document.getElementById('f_imgs').onchange=e=>{
    const files=[...(e.target.files||[])]; if(!files.length) return;
    let pending=files.length, overflow=false;
    files.forEach(f=>fileToDataURL(f,url=>{
      if(editImages.length<9){ editImages.push(url); renderThumbs(); }
      else overflow=true;
      if(--pending===0 && overflow) toast('最多 9 张，多余的已忽略');
    }));
    e.target.value='';
  };
  showModal();
}
function renderThumbs(){
  const tg=document.getElementById('f_thumbs'); if(!tg) return; tg.innerHTML='';
  editImages.forEach((src,i)=>{
    const t=document.createElement('div'); t.className='thumb';
    t.innerHTML=`<img src="${src}"><button class="x" type="button" onclick="removeThumb(${i})">×</button>`;
    tg.appendChild(t);
  });
}
function removeThumb(i){ editImages.splice(i,1); renderThumbs(); }
function saveItem(id){
  const m=TYPE_META[curType];
  const list=LS.get(m.key,[]);
  const idx=list.findIndex(x=>x.id===id);
  const data={
    id, cat:document.getElementById('f_cat').value,
    title:document.getElementById('f_title').value.trim(),
    desc:document.getElementById('f_desc').value.trim(),
    emoji:document.getElementById('f_emoji').value.trim()||'📌',
    images: editImages.slice()
  };
  if(!data.title){ toast('请填写标题'); return; }
  if(idx>=0) list[idx]=data; else list.unshift(data);
  LS.set(m.key,list); closeModal(); closeDetail(); renderCards(); toast('已保存，刷新页面亦可看到');
}
function delItem(id){
  if(!IS_LAN) return;
  if(!confirm('确定删除这条内容？')) return;
  const m=TYPE_META[curType];
  LS.set(m.key, LS.get(m.key,[]).filter(x=>x.id!==id));
  closeDetail(); renderCards(); toast('已删除');
}
/* 内容详情：顶部横向相册（左右滑）+ 下方正文（上下滑），两个区域 touch-action 隔离互不冲突 */
function openDetail(id){
  const m=TYPE_META[curType];
  const it=LS.get(m.key,[]).find(x=>x.id===id); if(!it) return;
  normImages(it);
  const dm=document.getElementById('detailModal');
  const gal=document.getElementById('dGallery');
  const body=document.getElementById('dBody');
  const oldCnt=dm.querySelector('.g-count'); if(oldCnt) oldCnt.remove();
  gal.innerHTML=''; body.innerHTML='';
  const imgs = it.images||[];
  if(imgs.length){
    imgs.forEach(src=>{
      const s=document.createElement('div'); s.className='g-slide';
      s.innerHTML=`<img src="${src}" alt="">`; gal.appendChild(s);
    });
    const cnt=document.createElement('div'); cnt.className='g-count'; cnt.textContent=`1/${imgs.length}`;
    dm.appendChild(cnt);
    gal.onscroll=()=>{ const i=Math.max(1,Math.round(gal.scrollLeft/gal.clientWidth)+1); cnt.textContent=`${i}/${imgs.length}`; };
    if(imgs.length>1){
      const hint=document.createElement('p'); hint.className='hint';
      hint.textContent='← 左右滑动查看全部 '+imgs.length+' 张图片 →';
      body.appendChild(hint);
    }
  } else {
    const s=document.createElement('div'); s.className='g-slide'; s.style.background='var(--brand-light)';
    s.innerHTML=`<div class="ph">${it.emoji||'📌'}</div>`; gal.appendChild(s);
  }
  const info=document.createElement('div');
  info.innerHTML=`<span class="tag">${esc(it.cat||'')}</span><div class="dt">${esc(it.title||'')}</div><div class="dd">${esc(it.desc||'')}</div>`;
  body.appendChild(info);
  const ops=document.getElementById('dOps');
  if(IS_LAN){
    ops.style.display='flex';
    ops.innerHTML=`<button class="e" onclick="openItemEdit('${it.id}');closeDetail();">编辑</button><button class="d" onclick="delItem('${it.id}')">删除</button>`;
  } else { ops.style.display='none'; ops.innerHTML=''; }
  dm.classList.remove('hidden');
}
function closeDetail(){ document.getElementById('detailModal').classList.add('hidden'); }
function openHomeEdit(){
  if(!IS_LAN){ toast('只读模式，无法编辑'); return; }
  const sheet=document.getElementById('sheet');
  sheet.innerHTML=`
    <h3>编辑首页</h3>
    <div class="field"><label>首页标题</label><input id="h_title" value="${esc(LS.get(K.title,''))}"></div>
    <div class="field"><label>学院简介</label><textarea id="h_intro">${esc(LS.get(K.intro,''))}</textarea></div>
    <div class="section-title">轮播图（${LS.get(K.car,[]).length} 张）</div>
    <div id="carEditor"></div>
    <div class="actions">
      <button class="btn-cancel" onclick="closeModal()">取消</button>
      <button class="btn-ok" onclick="saveHome()">保存</button>
    </div>`;
  const ce=document.getElementById('carEditor');
  LS.get(K.car,[]).forEach((s,i)=>{
    const row=document.createElement('div'); row.style.cssText='border:1px solid #eee;border-radius:12px;padding:10px;margin-bottom:10px;';
    row.innerHTML=`<div style="display:flex;gap:8px;align-items:center;">
      <input id="car_emoji_${s.id}" value="${esc(s.emoji||'')}" style="width:54px;text-align:center;font-size:20px;border:1px solid #e2e4e8;border-radius:10px;padding:8px;">
      <input id="car_cap_${s.id}" value="${esc(s.cap||'')}" placeholder="文案" style="flex:1;border:1px solid #e2e4e8;border-radius:10px;padding:10px;font-size:15px;">
      <input id="car_color_${s.id}" value="${esc(s.color||'#ff7823')}" type="color" style="width:42px;height:42px;border:none;background:none;">
      <button onclick="delSlide('${s.id}')" style="border:none;background:#fdecec;color:#e23b3b;border-radius:10px;padding:8px 10px;font-weight:700;cursor:pointer;">删</button>
    </div>`;
    ce.appendChild(row);
  });
  showModal();
}
function delSlide(id){
  LS.set(K.car, LS.get(K.car,[]).filter(s=>s.id!==id));
  openHomeEdit(); // 重渲染编辑器
}
function saveHome(){
  LS.set(K.title, document.getElementById('h_title').value.trim());
  LS.set(K.intro, document.getElementById('h_intro').value);
  const car=LS.get(K.car,[]).map(s=>({
    id:s.id,
    emoji:document.getElementById('car_emoji_'+s.id).value.trim()||'🖼️',
    cap:document.getElementById('car_cap_'+s.id).value.trim(),
    color:document.getElementById('car_color_'+s.id).value
  }));
  LS.set(K.car,car);
  closeModal(); renderHome(); toast('首页已更新');
}

/* 图片压缩为 dataURL（限制尺寸，避免撑爆 LocalStorage） */
function fileToDataURL(file,cb){
  const r=new FileReader();
  r.onload=e=>{ const img=new Image();
    img.onload=()=>{ let w=img.width,h=img.height,max=900;
      if(w>max||h>max){const r=Math.min(max/w,max/h);w=Math.round(w*r);h=Math.round(h*r);}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.7)); };
    img.src=e.target.result; };
  r.readAsDataURL(file);
}

/* =========================================================
   6) 模态 / Toast 工具
   ========================================================= */
function showModal(){ document.getElementById('modal').classList.remove('hidden'); }
function closeModal(){ document.getElementById('modal').classList.add('hidden'); }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
let toastTimer=null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),1600); }

/* 初始化 */
renderHome();
